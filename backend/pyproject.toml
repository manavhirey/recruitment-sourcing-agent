[project]
name = "recruitment-sourcing-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "boto3>=1.34",
  "celery[redis]>=5.4",
  "cryptography>=42",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.50",
  "opentelemetry-api>=1.27",
  "prometheus-client>=0.21",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.5",
  "pyjwt[crypto]>=2.9",
  "sqlalchemy>=2.0",
  "structlog>=24.4",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "freezegun>=1.5",
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
