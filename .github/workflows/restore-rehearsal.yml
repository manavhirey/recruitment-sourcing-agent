name: Weekly logical database restore mechanics

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-restore-rehearsal
  cancel-in-progress: false

jobs:
  logical-database-mechanics:
    runs-on: ubuntu-24.04
    environment: restore-rehearsal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.8.13"
      - run: uv sync --project backend --frozen
      - name: Prove logical database copy integrity and RLS mechanics only
        env:
          RESTORE_SOURCE_DATABASE_URL: ${{ secrets.RESTORE_SOURCE_DATABASE_URL }}
          RESTORE_ADMIN_DATABASE_URL: ${{ secrets.RESTORE_ADMIN_DATABASE_URL }}
          RESTORE_DATABASE_NAME: sourcing_restore_${{ github.run_id }}
        run: uv run --project backend python backend/scripts/restore_rehearsal.py
      - name: Record intentionally limited proof scope
        run: |
          {
            echo '### Logical restore mechanics only'
            echo 'This job is not cloud PITR/object-version/launch evidence.'
            echo 'Launch remains blocked pending isolated cloud restore, privacy non-resurrection, Alembic/E2E, immutable evidence, and approved alert delivery.'
          } >> "$GITHUB_STEP_SUMMARY"
