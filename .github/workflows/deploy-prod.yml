name: Deploy production

# Deploys after the "Release gates" workflow succeeds on main, so tests,
# supply-chain scans, and migration gates always pass before production.
on:
  workflow_run:
    workflows: ["Release gates"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/recruitment-sourcing-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/recruitment-sourcing-web

jobs:
  deploy-production:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - name: Build and push images
        env:
          IMAGE_TAG: main-${{ github.event.workflow_run.head_sha }}
        run: |
          docker build --pull -t "$API_IMAGE:$IMAGE_TAG" ./backend
          docker build --pull -t "$WEB_IMAGE:$IMAGE_TAG" ./web
          docker push "$API_IMAGE:$IMAGE_TAG"
          docker push "$WEB_IMAGE:$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Deploy over SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s' "$VPS_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" \
            "bash -s" -- prod "${{ github.event.workflow_run.head_sha }}" "$IMAGE_TAG" \
            < ops/deploy/deploy.sh
