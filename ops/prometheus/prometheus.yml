global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sourcing-api
    static_configs:
      - targets: ["api:9100"]
  - job_name: sourcing-worker
    static_configs:
      - targets: ["worker:9101"]
  - job_name: sourcing-maintenance
    static_configs:
      - targets: ["maintenance-worker:9102"]
